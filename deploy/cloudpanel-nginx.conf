# Add INSIDE the existing HTTPS server block for my.beykoz.edu.tr.
# Preserve the site's other locations. This prefix bypasses generic static-file
# regex locations: ALL /pdf/ requests must reach the authentication middleware.
location = /pdf {
    return 308 /pdf/;
}

location ^~ /pdf/ {
    # No trailing slash: retain /pdf in the upstream request URI.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This vhost is the single trusted hop. Overwrite user-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_buffering off;
    client_max_body_size 512k;
    proxy_read_timeout 60s;
}
