name: PDF Duzenle checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            engine/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, openssl, mbstring, zlib
          tools: composer
      - run: npm ci
      - run: npm run install:engine
      - run: composer install --no-dev --prefer-dist --no-interaction
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-duzenle-php
          path: dist/pdf-duzenle-php.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
